services:
  fluidd:
    image: yeahscience/fluidd:latest
    container_name: fluidd
    restart: unless-stopped
    environment:
      - PORT=80
    networks:
      - gateway_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway_default"
      - "traefik.http.routers.fluidd.rule=Host(`fluidd.citrx.org`)"
      - "traefik.http.routers.fluidd.entrypoints=websecure"
      - "traefik.http.routers.fluidd.tls=true"
      - "traefik.http.routers.fluidd.tls.certresolver=letsencrypt"
      - "traefik.http.services.fluidd.loadbalancer.server.port=80"
      - "traefik.http.routers.fluidd.middlewares=authelia@docker"

networks:
  gateway_default:
    external: true
